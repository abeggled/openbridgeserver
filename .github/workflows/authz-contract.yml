name: AuthZ Contract

on:
  push:
    branches:
      - main
      - '[0-9][0-9][0-9][0-9].*.x'
      - bug/*
      - bugfix/*
      - feat/*
      - feature/*
  pull_request:
    branches:
      - main
      - '[0-9][0-9][0-9][0-9].*.x'

permissions: {}

jobs:
  authz-contract:
    name: authz-contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements_dev.txt

      - name: Validate route security contracts
        run: python tools/check_authz_contract.py

      - name: Run authorization contract tests
        run: >-
          pytest -q
          tests/unit/test_security_contract_registry.py
          tests/unit/test_api_v1_route_classification_registry.py
          tests/unit/test_authz_policy.py
          tests/unit/test_authz_creation_authority_matrix.py
          tests/unit/test_audit_log.py
